<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>For Anastasya ✨</title> 
    <style> 
        body { 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #f4ebd9; 
            font-family: 'Georgia', serif; 
            transition: background 1.5s ease; 
            overflow: hidden; 
        } 
        body.opened { 
            background-color: #5c0618; 
        } 
        .envelope-wrapper { 
            position: relative; 
            cursor: pointer; 
            transition: transform 0.5s ease; 
        } 
        .envelope { 
            width: 300px; 
            height: 200px; 
            background-color: #5c0618; 
            position: relative; 
            border-radius: 0 0 10px 10px; 
            box-shadow: 0 12px 25px rgba(0,0,0,0.3); 
            z-index: 4;
            transition: background-color 1s ease;
        } 
        .envelope::before { 
            content: ""; 
            position: absolute; 
            top: 0; 
            left: 0; 
            border-left: 150px solid transparent; 
            border-right: 150px solid transparent; 
            border-top: 110px solid #42020e; 
            transform-origin: top; 
            transition: transform 0.5s ease, border-top-color 1s ease; 
            z-index: 5; 
        } 
        .envelope-wrapper.open .envelope {
            background-color: #e0d0b3;
        }
        .envelope-wrapper.open .envelope::before { 
            transform: rotateX(180deg); 
            border-top-color: #cfbe9f;
            z-index: 1; 
        } 
        .text-on-envelope { 
            position: absolute; 
            width: 100%; 
            text-align: center; 
            top: 60%; 
            font-size: 20px; 
            color: #dfba6b; 
            font-style: italic; 
            z-index: 6; 
            pointer-events: none; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: color 0.5s ease;
        } 
        .envelope-wrapper.open .text-on-envelope {
            color: #4a3b2c;
        }
        .card { 
            width: 270px; 
            height: 195px; 
            background-color: #fcf8f2; 
            position: absolute; 
            top: 5px; 
            left: 15px; 
            border-radius: 5px; 
            z-index: 2; 
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            padding: 14px; 
            box-sizing: border-box; 
            text-align: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
        } 
        .envelope-wrapper.open .card { 
            transform: translateY(-135px); 
            z-index: 5; 
        } 
        .floating-element { 
            position: absolute; 
            bottom: 60px; 
            font-size: 30px; 
            opacity: 0; 
            pointer-events: none; 
            z-index: 10; 
        } 
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #dfba6b;
            border-radius: 50%;
            box-shadow: 0 0 10px #dfba6b, 0 0 20px #dfba6b;
            pointer-events: none;
            z-index: 10;
            animation: explode 1.2s ease-out forwards;
        }
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(0.5); opacity: 0; } 
            20% { opacity: 1; } 
            100% { transform: translateY(-380px) translateX(var(--random-x)) rotate(var(--random-deg)); opacity: 0; } 
        } 
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--var-y)) scale(0); opacity: 0; }
        }
    </style> 
</head> 
<body> 

<div class="envelope-wrapper" id="envelopeWrapper"> 
    <div class="envelope"></div> 
    <div class="text-on-envelope">For Anastasya ✨</div> 
    <div class="card"> 
        <h3 style="color: #5c0618; margin: 0 0 6px 0; font-size: 16px;">Dear Anastasya,</h3> 
        <p style="font-size: 11.5px; color: #444; margin: 0 0 6px 0; line-height: 1.4;">
            Thank you so much for the lovely invitation! I'm so sorry I can't make it tonight due to a sudden back pain. 🥺
        </p> 
        <p style="font-style: italic; font-weight: bold; color: #5c0618; font-size: 14px; margin: 0 0 6px 0;">
            "Καλορίζικο το νέο σπίτι!" 🥂
        </p> 
        <p style="font-size: 11px; color: #555; margin: 0 0 6px 0; line-height: 1.3;">
            Have a wonderful evening! Next time, the wine is on me! 🍷
        </p> 
        <p style="font-size: 12px; color: #5c0618; font-style: italic; margin: 4px 0 0 0; font-weight: bold;">With love, Ani ❤️</p>
    </div> 
</div> 

<script> 
    const wrapper = document.getElementById('envelopeWrapper'); 
    let isOpened = false; 

    wrapper.addEventListener('click', () => { 
        if (!isOpened) { 
            wrapper.classList.add('open'); 
            document.body.classList.add('opened'); 
            createFloatingElements(); 
            createSparkles(25);
            isOpened = true; 
        } 
    }); 

    function createFloatingElements() { 
        const items = ['❤️', '🍷', '✨', '🥂', '❤️']; 
        items.forEach((item, index) => { 
            setTimeout(() => { 
                const el = document.createElement('div'); 
                el.className = 'floating-element'; 
                el.innerText = item; 
                const randomX = Math.floor(Math.random() * 200) - 100; 
                const randomDeg = Math.floor(Math.random() * 90) - 45; 
                el.style.setProperty('--random-x', `${randomX}px`); 
                el.style.setProperty('--random-deg', `${randomDeg}deg`); 
                el.style.left = `${120 + (Math.random() * 40)}px`; 
                el.style.animation = 'floatUp 2.8s ease-out forwards'; 
                wrapper.appendChild(el); 
                setTimeout(() => el.remove(), 2800); 
            }, index * 250); 
        }); 
    }

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You Anastasya! ✨</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f1ea;
            margin: 0;
            font-family: 'Georgia', serif;
        }
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
        }
        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background: #2c3e50;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border-radius: 0 0 5px 5px;
        }
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 100px solid #34495e;
            transform-origin: top;
            transition: transform 0.4s ease;
            z-index: 3;
        }
        .card {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 280px;
            height: 180px;
            background: #fff;
            border-radius: 4px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            transition: transform 0.5s ease, z-index 0s 0.2s;
            z-index: 1;
        }
        .card h1 {
            font-size: 18px;
            color: #b89742;
            margin-bottom: 5px;
        }
        .card p {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            margin: 5px 0;
        }
        .envelope-wrapper.open .envelope::before {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .envelope-wrapper.open .card {
            transform: translateY(-110px);
            z-index: 4;
        }
        .text-on-env {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #dfba6b;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 2;
        }
    </style>
</head>
<body>

<div class="envelope-wrapper" onclick="this.classList.toggle('open')">
    <div class="envelope">
        <div class="text-on-env">For Anastasya ✨</div>
    </div>
    <div class="card">
        <h1>Dear Anastasya,</h1>
        <p>Thank you so much for the lovely invitation! 🍷</p>
        <p style="font-style: italic; font-weight: bold; color: #2c3e50; font-size: 15px; margin: 10px 0;">
            "Καλορίζικο το νέο σπίτι!"
        </p>
        <p>Wishing you endless joy and beautiful memories in your new home!</p>
    </div>
</div>

</body>
</html>

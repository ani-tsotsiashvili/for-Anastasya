<!DOCTYPE html> 
<html lang="ka"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>For Anastasya</title> 
    <style> 
        /* ჯაზური, ვინტაჟური თბილი მოყვითალო ფონი თავიდან */ 
        body { 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #f4ebd9; 
            font-family: 'Georgia', serif; 
            transition: background 2s ease; 
            overflow: hidden; 
        } 
        /* როცა კონვერტი გაიხსნება, ფონი გახდება მდიდრული შინდისფერი */ 
        body.opened { 
            background-color: #5c0618; 
        } 
        .envelope-wrapper { 
            position: relative; 
            cursor: pointer; 
            transition: transform 0.5s ease; 
        } 
        /* კონვერტის დიზაინი */ 
        .envelope { 
            width: 280px; 
            height: 180px; 
            background-color: #e0d0b3; 
            position: relative; 
            border-radius: 0 0 10px 10px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
        } 
        .envelope::before { 
            content: ""; 
            position: absolute; 
            top: 0; 
            left: 0; 
            border-left: 140px solid transparent; 
            border-right: 140px solid transparent; 
            border-top: 100px solid #cfbe9f; 
            transform-origin: top; 
            transition: transform 0.5s ease; 
            z-index: 3; 
        } 
        /* კონვერტის გახსნის ანიმაცია */ 
        .envelope-wrapper.open .envelope::before { 
            transform: rotateX(180deg); 
            z-index: 1; 
        } 
        .text-on-envelope { 
            position: absolute; 
            width: 100%; 
            text-align: center; 
            top: 60%; 
            font-size: 20px; 
            color: #4a3b2c; 
            font-style: italic; 
            z-index: 4; 
            pointer-events: none; 
        } 
        /* მადლობის ბარათი კონვერტში */ 
        .card { 
            width: 250px; 
            height: 160px; 
            background-color: #fff; 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            border-radius: 5px; 
            z-index: 2; 
            transition: transform 0.5s ease; 
            padding: 15px; 
            box-sizing: border-box; 
            text-align: center; 
            box-shadow: 0 5px 10px rgba(0,0,0,0.1); 
        } 
        .envelope-wrapper.open .card { 
            transform: translateY(-110px); 
            z-index: 3; 
        } 
        /* ამომფრენი ემოციების სტილი */ 
        .floating-element { 
            position: absolute; 
            bottom: 50px; 
            font-size: 30px; 
            opacity: 0; 
            pointer-events: none; 
            z-index: 10; 
        } 
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(0.5); opacity: 0; } 
            20% { opacity: 1; } 
            100% { transform: translateY(-400px) translateX(var(--random-x)) rotate(var(--random-deg)); opacity: 0; } 
        } 
    </style> 
</head> 
<body> 

<!-- აუდიო ფლეიერი თქვენი მუსიკისთვის --> 
<audio id="bg-music" src="music.mp3" loop></audio> 

<div class="envelope-wrapper" id="envelopeWrapper"> 
    <div class="envelope"></div> 
    <div class="text-on-envelope">For Anastasya</div> 
    <div class="card"> 
        <h3 style="color: #5c0618; margin: 0 0 5px 0; font-size: 16px;">Dear Anastasya,</h3> 
        <p style="font-size: 12px; color: #555; margin: 0 0 8px 0;">Thank you so much for the lovely invitation! 🥂</p> 
        <p style="font-style: italic; font-weight: bold; color: #5c0618; font-size: 14px; margin: 0 0 8px 0;">
            "Καλορίζικο το νέο σπίτι!"
        </p> 
        <p style="font-size: 11px; color: #777; margin: 0 0 5px 0;">Wishing you endless joy in your new home.</p> 
        <p style="font-size: 12px; color: #4a3b2c; font-style: italic; margin: 5px 0 0 0; font-weight: bold;">With love, Ani ❤️</p>
    </div> 
</div> 

<script> 
    const wrapper = document.getElementById('envelopeWrapper'); 
    const music = document.getElementById('bg-music'); 
    let isOpened = false; 

    wrapper.addEventListener('click', () => { 
        if (!isOpened) { 
            // კონვერტის გახსნა 
            wrapper.classList.add('open'); 
            document.body.classList.add('opened'); 
            // მუსიკის ჩართვა უშუალოდ თითის დაჭერაზე 
            music.play().catch(error => console.log("ბრაუზერმა დაბლოკა ხმა:", error)); 
            // გულებისა და ღვინის ჭიქების ამოფრენა 
            createFloatingElements(); 
            isOpened = true; 
        } 
    }); 

    function createFloatingElements() { 
        // სიმბოლოების მასივი (3 გული, 2 ჭიქა) 
        const items = ['❤️', '🍷', '❤️', '🍷', '❤️']; 
        items.forEach((item, index) => { 
            setTimeout(() => { 
                const el = document.createElement('div'); 
                el.className = 'floating-element'; 
                el.innerText = item; 
                // შემთხვევითი მიმართულებები ამოფრენისას 
                const randomX = Math.floor(Math.random() * 200) - 100; 
                const randomDeg = Math.floor(Math.random() * 90) - 45; 
                el.style.setProperty('--random-x', `${randomX}px`); 
                el.style.setProperty('--random-deg', `${randomDeg}deg`); 
                el.style.left = `${120 + (Math.random() * 40)}px`; 
                el.style.animation = 'floatUp 3s ease-out forwards'; 
                wrapper.appendChild(el); 
                // ელემენტის წაშლა ანიმაციის მერე 
                setTimeout(() => el.remove(), 3000); 
            }, index * 300); // მცირე დაყოვნება სათითაოდ ამოსასვლელად 
        }); 
    } 
</script> 
</body> 
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You Anastasya! ✨</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* კლასიკური ღვინისა და მყუდრო განათების ფონი */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            margin: 0;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
        }
        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background: #1a252f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 0 0 5px 5px;
            z-index: 2;
        }
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 100px solid #2c3e50;
            transform-origin: top;
            transition: transform 0.4s ease;
            z-index: 3;
        }
        .card {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 280px;
            height: 180px;
            background: #fff;
            border-radius: 4px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            transition: transform 0.5s ease, z-index 0s 0.2s;
            z-index: 1;
        }
        .card h1 {
            font-size: 18px;
            color: #b89742;
            margin-bottom: 5px;
        }
        .card p {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            margin: 5px 0;
        }
        .envelope-wrapper.open .envelope::before {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .envelope-wrapper.open .card {
            transform: translateY(-110px);
            z-index: 4;
        }
        .text-on-env {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #dfba6b;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 2;
        }
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #dfba6b;
            border-radius: 50%;
            box-shadow: 0 0 10px #dfba6b, 0 0 20px #dfba6b;
            pointer-events: none;
            z-index: 5;
            animation: fly 1s ease-out forwards;
        }
        @keyframes fly {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--var-y)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="envelope-wrapper" id="envelope-btn">
    <div class="envelope">
        <div class="text-on-env">For Anastasya ✨</div>
    </div>
    <div class="card">
        <h1>Dear Anastasya,</h1>
        <p>Thank you so much for the lovely invitation! 🍷</p>
        <p style="font-style: italic; font-weight: bold; color: #2c3e50; font-size: 15px; margin: 10px 0;">
            "Καλορίζικο το νέο σπίτι!"
        </p>
        <p>Wishing you endless joy and beautiful memories in your new home!</p>
    </div>
</div>

<script>
    const envelope = document.getElementById('envelope-btn');

    envelope.addEventListener('click', function() {
        this.classList.toggle('open');
        if (this.classList.contains('open')) {
            createSparkles(35);
        }
    });

    function createSparkles(num) {
        for (let i = 0; i < num; i++) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            sparkle.style.left = '150px';
            sparkle.style.top = '100px';
            const x = (Math.random() - 0.5) * 350;
            const y = (Math.random() - 0.7) * 350; 
            sparkle.style.setProperty('--x', `${x}px`);
            sparkle.style.setProperty('--var-y', `${y}px`);
            envelope.appendChild(sparkle);
            setTimeout(() => { sparkle.remove(); }, 1000);
        }
    }
</script>

</body>
</html>
